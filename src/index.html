<!doctype html>
<html lang="en" class="bg-ink">
<head>
  <meta charset="utf-8">
  <title>STAG — Cold Craft Refreshment</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="STAG is botanical craft sparkling refreshment: real fruit, micro-carbonation and pure mountain spring water in a can.">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="STAG — Cold Craft Refreshment">
  <meta property="og:description" content="Real fruit. Velvet effervescence. Botanical craft sparkling refreshment.">
  <meta property="og:image" content="/assets/products/strawberry.webp">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Paint the first hero frame immediately (largest contentful element) -->
  <link rel="preload" as="image" href="/assets/scroll/flow/f_001.webp" type="image/webp" fetchpriority="high">
  <!-- Lets CSS hide reveal-on-scroll elements only when JavaScript is available -->
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-ink font-sans text-neutral-50 antialiased selection:bg-white/20 selection:text-white">

  <!-- SPLASH SCREEN -->
  <div id="app-splash" aria-hidden="true">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        background: #09090b;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-image:
          radial-gradient(55% 50% at 50% 60%, rgba(225,29,72,0.14), transparent 70%),
          radial-gradient(40% 40% at 15% 20%, rgba(109,40,217,0.08), transparent 70%);
        transition: opacity 0.55s cubic-bezier(0.16,1,0.3,1);
      }
      #app-splash.splash-hidden { opacity: 0; pointer-events: none; }
      .splash-wordmark { display:flex; flex-direction:column; align-items:center; gap:0.5rem; animation: splash-pop-in 0.6s cubic-bezier(0.16,1,0.3,1) both; }
      .splash-wordmark-title { font-size:3.5rem; font-weight:700; letter-spacing:-0.04em; color:#fff; line-height:1; }
      .splash-wordmark-title span { color:#dc2626; }
      .splash-wordmark-sub { font-size:0.6rem; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#71717a; }
      .splash-spinner { position:relative; width:36px; height:36px; animation: splash-pop-in 0.6s 0.15s cubic-bezier(0.16,1,0.3,1) both; }
      .splash-spinner::before,.splash-spinner::after { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid transparent; }
      .splash-spinner::before { border-color:rgba(255,255,255,0.07); }
      .splash-spinner::after { border-top-color:#e11d48; border-right-color:rgba(225,29,72,0.3); animation: splash-spin 0.9s linear infinite; }
      @keyframes splash-pop-in { from{opacity:0;transform:translate3d(0,10px,0) scale(0.97)} to{opacity:1;transform:translate3d(0,0,0) scale(1)} }
      @keyframes splash-spin { to{transform:rotate(360deg)} }
      @media (prefers-reduced-motion:reduce) {
        .splash-spinner::after{animation:none}
        .splash-wordmark,.splash-spinner{animation:none;opacity:1;transform:none}
      }
    </style>
    <div class="splash-wordmark">
      <div class="splash-wordmark-title">ST<span>A</span>G</div>
      <div class="splash-wordmark-sub">Cold Craft Refreshment</div>
    </div>
    <div class="splash-spinner"></div>
  </div>
  <!-- END SPLASH -->

  <app-root></app-root>
  <noscript>
    <p style="padding:6rem 1.5rem;text-align:center;color:#a1a1aa">STAG works best with JavaScript enabled.</p>
  </noscript>

  <script>
    (function(){
      var splash=document.getElementById('app-splash');
      if(!splash)return;
      var root=document.querySelector('app-root');
      if(!root){splash.classList.add('splash-hidden');return;}
      var observer=new MutationObserver(function(){
        if(root.children.length>0){
          observer.disconnect();
          setTimeout(function(){
            splash.classList.add('splash-hidden');
            setTimeout(function(){splash.remove();},600);
          },120);
        }
      });
      observer.observe(root,{childList:true});
      setTimeout(function(){
        observer.disconnect();
        splash.classList.add('splash-hidden');
        setTimeout(function(){splash.remove();},600);
      },8000);
    })();
  </script>
</body>
</html>
